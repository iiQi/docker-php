name: Build

on:
  schedule:
    - cron: 0 6 * * 0
  workflow_dispatch:
    inputs:
      phpVersions:
        description: '指定编译的PHP版本，多个版本间以,分隔。不填默认从配置文件获取。'
        default: ''
        required: false
        type: string
      buildExclude:
        description: '要排除的构建参数，格式：version-suite-distro。一行一个，支持正则表达式。'
        default: ''
        required: false
        type: string
      suites:
        description: '自定义套件名称，多个以,分隔。名称转大写、-转_后读取 vars.SUITE_<名称>；填写后仅构建这些套件。'
        default: ''
        required: false
        type: string

run-name: build ${{ inputs.phpVersions || 'default'  }}

env:
  RUNTIME_CONFIG: config/runtime.yaml

permissions:
  packages: write

jobs:
  prepare:
    name: Prepare
    runs-on: "ubuntu-latest"
    outputs:
      buildConfig: ${{ steps.prepare.outputs.buildConfig }}
      syncConfig: ${{ steps.prepare.outputs.syncConfig }}
      suiteConfig: ${{ steps.prepare.outputs.suiteConfig }}
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7
      - name: Prepare
        id: prepare
        env:
          REGISTRIES: ${{ vars.REGISTRIES }}
          PHP_VERSIONS: ${{ inputs.phpVersions }}
          BUILD_EXCLUDE: ${{ inputs.buildExclude || vars.BUILD_EXCLUDE }}
          SUITES: ${{ inputs.suites }}
          SUITE_VARS: ${{ toJSON(vars) }}
        run: |
          registries="$REGISTRIES"
          phpVersions="$PHP_VERSIONS"
          buildExclude="$BUILD_EXCLUDE"
          suites="$SUITES"
          ciVersion=${GITHUB_RUN_NUMBER:-0}

          suiteConfigFile=''
          trap 'if [ -n "$suiteConfigFile" ]; then rm -f -- "$suiteConfigFile"; fi' EXIT
          . tools/prepare.sh

          echo buildConfig="$buildConfig" >> "$GITHUB_OUTPUT"
          echo syncConfig="$syncConfig" >> "$GITHUB_OUTPUT"

          # 自定义套件模式：输出 prepare 阶段生成好的完整 suite.yaml，供构建阶段写回
          if [ -n "$customSuites" ]; then
            {
              echo 'suiteConfig<<__SUITE_CONFIG__'
              cat "$SUITE_CONFIG"
              echo '__SUITE_CONFIG__'
            } >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build ${{ matrix.version }}-${{ matrix.suite }}-${{ matrix.distro }}
    runs-on: "ubuntu-latest"
    needs:
      - prepare
    strategy:
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.buildConfig) }}
      fail-fast: false
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7

      - name: Config
        id: config
        shell: bash
        working-directory: build
        env:
          SUITE_CONFIG_CONTENT: ${{ needs.prepare.outputs.suiteConfig }}
          REGISTRY: ${{ matrix.registry }}
          IMAGE: ${{ matrix.image }}
          MATRIX_TAGS: ${{ matrix.tags }}
          MATRIX_DEV_TAGS: ${{ matrix.dev_tags }}
          REPO_CHANGE: ${{ vars.RUNTIME_REPO_CHANGE }}
        run: |
          # 自定义套件模式：写回 prepare 阶段生成好的 suite.yaml
          if [ -n "$SUITE_CONFIG_CONTENT" ]; then
            printf '%s' "$SUITE_CONFIG_CONTENT" > config/suite.yaml
          fi

          registry="$REGISTRY"
          registry=${registry#docker.io}
          registry=${registry:+$registry/}
          image="$IMAGE"

          export registry image

          tags=$(yq '[ .[] | strenv(registry) + strenv(image) + ":" + . ] | @csv ' <<< "$MATRIX_TAGS")
          devTags=$(yq '[ .[] | strenv(registry) + strenv(image) + ":" + . ] | @csv ' <<< "$MATRIX_DEV_TAGS")
          devBase=$(tr ',' '\n' <<< "$tags" | head -n 1)
          
          echo tags="$tags" >> "$GITHUB_OUTPUT"
          echo devTags="$devTags" >> "$GITHUB_OUTPUT"
          echo devBase="$devBase" >> "$GITHUB_OUTPUT"
          
          repoChange=${REPO_CHANGE:-"after"}
          
          export repoChange
          yq '.repo.change = strenv(repoChange)' <<< '' > "$RUNTIME_CONFIG"

          cp /usr/bin/yq ./

      - name: Print Config
        shell: bash
        env:
          DISTRO: ${{ matrix.distro }}
          SUITE: ${{ matrix.suite }}
          VERSION: ${{ matrix.version }}
          CMD: ${{ matrix.cmd }}
          FROM: ${{ matrix.from }}
          TAGS: ${{ steps.config.outputs.tags }}
          DEV_TAGS: ${{ steps.config.outputs.devTags }}
          DEV_BASE: ${{ steps.config.outputs.devBase }}
        run: |
          printf '%s\n' "distro: $DISTRO" "suite: $SUITE" "version: $VERSION" \
            "cmd: $CMD" "from: $FROM" "tags: $TAGS" "devTags: $DEV_TAGS" "devBase: $DEV_BASE"

      - name: Docker login Build Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ matrix.registry }}
          username: ${{ secrets[matrix.username] }}
          password: ${{ secrets[matrix.password] }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker BuildX
        uses: docker/setup-buildx-action@v3
        with:
          buildkitd-flags: --debug

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: ${{ vars.BUILD_PLATFORMS }}
          pull: true
          push: true
          provenance: false
          cache-from: type=gha,scope=${{ matrix.distro }}-${{ matrix.suite }}-${{ matrix.version }}
          cache-to: type=gha,mode=max,scope=${{ matrix.distro }}-${{ matrix.suite }}-${{ matrix.version }}
          build-args: |
            DISTRO=${{ matrix.distro }}
            SUITE=${{ matrix.suite }}
            VERSION=${{ matrix.version }}
            PHP_EXT=${{ matrix.ext }}
            EXEC_CMD=${{ matrix.cmd }}
            FROM=${{ matrix.from }}

          tags: |
            ${{ steps.config.outputs.tags }}

      - name: Build Dev
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile-dev
          platforms: ${{ vars.BUILD_PLATFORMS }}
          pull: true
          push: true
          provenance: false
          cache-from: type=gha,scope=${{ matrix.distro }}-${{ matrix.suite }}-${{ matrix.version }}-dev
          cache-to: type=gha,mode=max,scope=${{ matrix.distro }}-${{ matrix.suite }}-${{ matrix.version }}-dev
          build-args: |
            DISTRO=${{ matrix.distro }}
            SUITE=${{ matrix.suite }}
            VERSION=${{ matrix.version }}
            BASE=${{ steps.config.outputs.devBase }}

          tags: |
            ${{ steps.config.outputs.devTags }}

      - name: Image Info
        env:
          DEV_BASE: ${{ steps.config.outputs.devBase }}
        run: |
          docker run --rm "$DEV_BASE" -m
          docker images

  sync:
    name: Sync To ${{ matrix.registry }}
    runs-on: "ubuntu-latest"
    needs:
      - prepare
      - build
    strategy:
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.syncConfig) }}
      fail-fast: false

    steps:
      - name: Check out repository code
        uses: actions/checkout@v7

      - name: Docker login ${{ matrix.registry }}
        uses: docker/login-action@v3
        with:
          registry: ${{ matrix.registry }}
          username: ${{ secrets[matrix.username] }}
          password: ${{ secrets[matrix.password] }}

      - name: Sync images
        env:
          registry: ${{ matrix.registry }}
          image: ${{ matrix.image }}
          sync: ${{ matrix.sync }}
        run: |
          set -eux
          . tools/sync.sh
