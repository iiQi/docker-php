name: Prepare config tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - tools/prepare.sh
      - build/build.sh
      - .github/workflows/build.yml
      - .github/workflows/prepare-tests.yml
      - tests/prepare-suites.sh
  push:
    paths:
      - tools/prepare.sh
      - build/build.sh
      - .github/workflows/build.yml
      - .github/workflows/prepare-tests.yml
      - tests/prepare-suites.sh

permissions:
  contents: read

jobs:
  prepare-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Test suite configuration
        env:
          YQ: /usr/bin/yq
        run: bash tests/prepare-suites.sh
